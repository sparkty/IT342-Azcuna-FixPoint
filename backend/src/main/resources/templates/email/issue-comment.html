<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Inter, sans-serif; background:#0f172a; color:#f1f5f9; padding:40px;">
  <div style="max-width:560px; margin:auto; background:#1e293b; border-radius:12px; padding:32px;">
    
    <h2 style="color:#FF4D2D; margin-top:0;">New Comment Added</h2>
    
    <p>Hi <span th:text="${firstname}">User</span>,</p>
    
    <p>An administrator has added a comment to your issue.</p>
    
    <div style="background:#0f172a; border-radius:8px; padding:16px; margin:20px 0;">
      <p style="margin:4px 0;">
        <span style="color:#94a3b8;">Issue: </span>
        <strong th:text="${issueTitle}">Issue Title</strong>
      </p>
      <p style="margin:4px 0;">
        <span style="color:#94a3b8;">Issue ID: </span>
        <span th:text="'#' + ${issueId}">#1</span>
      </p>
      <p style="margin:12px 0 4px 0; border-top:1px solid #334155; padding-top:12px;">
        <strong style="color:#FF4D2D;" th:text="${authorName}">Admin Name</strong>
        <span style="color:#94a3b8; font-size: 13px;"> (Admin) commented:</span>
      </p>
      <p style="margin:8px 0 0 0; color:#f1f5f9; white-space: pre-wrap; font-style: italic;" th:text="${commentContent}">
        Comment content goes here.
      </p>
    </div>
    
    <a th:href="${issueUrl}"
       style="display:inline-block; margin-top:8px; padding:12px 24px;
              background:#FF4D2D; color:white; border-radius:8px;
              text-decoration:none; font-weight:bold;">
      View Issue
    </a>
    
    <p style="margin-top:32px; font-size:12px; color:#94a3b8;">
      This is an automated notification from FixPoint. Please do not reply to this email.
    </p>
  </div>
</body>
</html>
