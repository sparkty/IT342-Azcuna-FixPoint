<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Inter, sans-serif; background:#0f172a; color:#f1f5f9; padding:40px;">
  <div style="max-width:560px; margin:auto; background:#1e293b; border-radius:12px; padding:32px;">
    
    <h2 style="color:#FF4D2D; margin-top:0;">Welcome to FixPoint</h2>
    
    <p>Hi <span th:text="${firstname}">User</span>,</p>
    
    <p>Your account has been created successfully. You can now log in and start reporting issues.</p>
    
    <a th:href="${loginUrl}"
       style="display:inline-block; margin-top:16px; padding:12px 24px;
              background:#FF4D2D; color:white; border-radius:8px;
              text-decoration:none; font-weight:bold;">
      Go to FixPoint
    </a>
    
    <p style="margin-top:32px; font-size:12px; color:#94a3b8;">
      If you didn't create this account, please ignore this email.
    </p>
  </div>
</body>
</html>
