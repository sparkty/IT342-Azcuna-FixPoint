<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Inter, sans-serif; background:#0f172a; color:#f1f5f9; padding:40px;">
  <div style="max-width:560px; margin:auto; background:#1e293b; border-radius:12px; padding:32px;">
    <h2 style="color:#FF4D2D; margin-top:0;">Reset your FixPoint password</h2>

    <p>Hi <span th:text="${firstname}">User</span>,</p>

    <p>We received a request to reset your password. This link will expire in 1 hour.</p>

    <a th:href="${resetUrl}"
       style="display:inline-block; margin-top:16px; padding:12px 24px;
              background:#FF4D2D; color:white; border-radius:8px;
              text-decoration:none; font-weight:bold;">
      Reset Password
    </a>

    <p style="margin-top:24px; font-size:12px; color:#94a3b8;">
      If you didn't request a password reset, you can safely ignore this email.
    </p>
  </div>
</body>
</html>
