# Server
server.port=${PORT:8080}

# Active Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# File upload
file.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET:fixpoint_super_secret_key_must_be_at_least_256_bits_long_for_hs256}
jwt.expiration=${JWT_EXPIRATION:${JW_EXPIRATION:86400000}}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:${JW_REFRESH_EXPIRATION:604800000}}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.url=${APP_FRONTEND_URL:${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}}

# Spring Mail Sender Properties (Consolidated for 100% reliable properties binding on Railway deployment)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:placeholder}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:placeholder}}

# App custom properties
app.mail.from=${MAIL_FROM:${APP_MAIL_FROM:${spring.mail.username:placeholder}}}
app.mail.name=${APP_MAIL_NAME:FixPoint}

# Google Integration
google.client-id=${GOOGLE_CLIENT_ID:placeholder}

# JavaMail SMTP properties (forcing Strings to avoid the YAML Boolean binding bug)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

logging.level.org.springframework.mail=DEBUG
logging.level.jakarta.mail=DEBUG