spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${MAIL_USERNAME:${SPRING_MAIL_USERNAME:placeholder}}
    password: ${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:placeholder}}

app:
  mail:
    from: ${MAIL_FROM:${APP_MAIL_FROM:${spring.mail.username:placeholder}}}
    name: ${APP_MAIL_NAME:FixPoint}

google:
  client-id: ${GOOGLE_CLIENT_ID:placeholder}

jwt:
  secret: ${JWT_SECRET:fixpoint_super_secret_key_must_be_at_least_256_bits_long_for_hs256}
  expiration: ${JWT_EXPIRATION:${JW_EXPIRATION:86400000}}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:${JW_REFRESH_EXPIRATION:604800000}}